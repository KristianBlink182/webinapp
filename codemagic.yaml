workflows:
  ios-workflow:
    name: iOS Flutter Native Build and Publish
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Livo
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pe.com.livo.app
      vars:
        XCODE_PROJECT: "public/mobile_app/ios/Runner.xcodeproj"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Get Flutter dependencies
        script: |
          cd public/mobile_app
          flutter packages get
      - name: Auto-increment iOS Build Number
        script: |
          cd public/mobile_app/ios && agvtool new-version -all $BUILD_NUMBER || true
      - name: Build iOS Native IPA
        script: |
          cd public/mobile_app
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - public/mobile_app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true