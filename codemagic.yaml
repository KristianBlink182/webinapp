workflows:
  ios-workflow:
    name: iOS Flutter Native Build and Publish
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Livo
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pe.com.livo.app
      vars:
        XCODE_WORKSPACE: "public/mobile_app/ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Initialize Flutter Native Project and CocoaPods
        script: |
          cd public/mobile_app
          flutter create --org pe.com.livo --project-name livo_app .
          flutter pub get
          cd ios
          pod install
      - name: Auto-increment iOS Build Number
        script: |
          cd public/mobile_app/ios && agvtool new-version -all $BUILD_NUMBER || true
      - name: Build iOS Native IPA
        script: |
          cd public/mobile_app
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - public/mobile_app/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true