workflows:
  ios-workflow:
    name: iOS Build and Publish
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Livo
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pe.com.livo.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install -g @capacitor/cli
      - name: Add iOS platform on Cloud Mac
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Set up automatic code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS App
        script: |
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true